[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gswap"
version = "0.3.0"
description = "Interactive multi-account switcher, runner & real-time quota viewer for Google CLI tools: Antigravity (agy), Colab, Drive (rclone), and Google Cloud (gcloud)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "L1meSn0w" }
]
keywords = ["google", "antigravity", "agy", "colab", "gcloud", "rclone", "google-drive", "account-switcher", "cli", "ccswap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/L1meSn0w/gswap"
Repository = "https://github.com/L1meSn0w/gswap"

[project.scripts]
gswap = "gswap:main"

[tool.setuptools]
py-modules = ["gswap"]
